<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAC CRM - Quản lý Hồ sơ ĐKKD</title>
  <meta name="description" content="Hệ thống CRM quản lý hồ sơ đăng ký kinh doanh - Công ty TNHH Dịch vụ Tư Vấn NAC">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- App CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <!-- Login screen (shown when not logged in) -->
    <div id="login-screen" class="login-container"></div>
    
    <!-- Main app (shown when logged in) -->
    <div id="main-app" class="app-layout" style="display:none">
      <aside id="sidebar" class="sidebar"></aside>
      <div class="main-wrapper">
        <header id="top-header" class="top-header"></header>
        <main id="page-content" class="page-content"></main>
      </div>
    </div>
    
    <!-- Toast container -->
    <div id="toast-container" class="toast-container"></div>
    
    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay"></div>
  </div>
  
  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
  
  <!-- App JS (order matters!) -->
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/table.js"></script>
  <script src="/js/components/notification.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/records.js"></script>
  <script src="/js/pages/customers.js"></script>
  <script src="/js/pages/finance.js"></script>
  <script src="/js/pages/reports.js"></script>
  <script src="/js/pages/settings.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
