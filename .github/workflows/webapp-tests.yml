name: webapp_v2 tests

on:
  push:
    paths:
      - "webapp_v2/**"
      - ".github/workflows/webapp-tests.yml"
  pull_request:
    paths:
      - "webapp_v2/**"
      - ".github/workflows/webapp-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webapp_v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            webapp_v2/requirements.txt
            webapp_v2/requirements-dev.txt

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt playwright

      - name: Cài trình duyệt Chromium cho test giao diện
        run: python -m playwright install --with-deps chromium

      - name: Quét bộ mẫu (lỗi E làm CI thất bại, cảnh báo W chỉ để xem)
        run: python -m tools.template_lint

      - name: Chạy pytest
        run: python -m pytest -v --durations=10
